version: '3.8'

services:
  # Unified App - Vite dev server dengan ALL API routes (export, content, icons, dll)
  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3373:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    networks:
      - mcp-network
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge
