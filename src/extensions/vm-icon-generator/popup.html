<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .topic-selector {
      margin-bottom: 12px;
    }
    .topic-selector label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .topic-selector select {
      width: 100%;
      padding: 8px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      cursor: pointer;
    }
    .topic-selector select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .topic-selector select[multiple] {
      min-height: 100px;
    }
    .topic-selector select[multiple] option {
      padding: 6px 8px;
      margin: 2px 0;
      border-radius: 4px;
    }
    .topic-selector select[multiple] option:checked {
      background: linear-gradient(90deg, #34d399 0%, #10b981 100%);
      color: #052e16;
      font-weight: 600;
    }
    .topic-info {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      min-height: 14px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #34d399;
      color: #052e16;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 12px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      white-space: pre-wrap;
      max-height: 300px;
      overflow: auto;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .preview img {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
    }
  </style>
</head>
<body>
  <h1>Content Icon Generator</h1>
  
  <div class="topic-selector">
    <label>Select Topic:</label>
    <select id="topicSelect" disabled>
      <option value="">Loading topics...</option>
    </select>
    <div class="topic-info" id="topicInfo"></div>
  </div>

  <div class="topic-selector" id="batchContainer" style="display: none;">
    <label>Select Batch(es) - Hold Ctrl/Cmd for multiple:</label>
    <select id="batchSelect" multiple size="4">
    </select>
    <div class="topic-info" id="batchInfo"></div>
  </div>
  
  <button id="generate" disabled>Generate Icons from ChatGPT</button>
  <div id="status" class="status">Ready. Select a topic to start.</div>
  <div id="preview" class="preview"></div>
  <script src="popup.js"></script>
</body>
</html>
