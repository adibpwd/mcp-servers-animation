<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #34d399;
      color: #052e16;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 12px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      white-space: pre-wrap;
      max-height: 300px;
      overflow: auto;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .preview img {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
    }
  </style>
</head>
<body>
  <h1>VM Icon Generator</h1>
  <button id="generate">Generate Icons from ChatGPT</button>
  <div id="status" class="status">Ready. Click "Generate Icons" to start.</div>
  <div id="preview" class="preview"></div>
  <script src="popup.js"></script>
</body>
</html>
